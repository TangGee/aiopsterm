name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Audit, typecheck and unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure native runtime (node)
        run: npm run native:ensure:node

      - name: Audit i18n coverage
        run: npm run audit:i18n

      - name: Audit state ownership
        run: npm run audit:state-ownership

      - name: Audit best-practices docs
        run: npm run audit:best-practices-docs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/unit.xml

      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-${{ matrix.os }}
          path: test-results/unit.xml

  desktop:
    name: Core desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 fonts-noto-cjk
      - run: npm run test:regression -- core
      - name: Upload desktop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
