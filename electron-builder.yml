appId: app.aiopsterm.desktop
productName: aiopsterm
toolsets:
  appimage: "1.0.3"
directories:
  buildResources: resources
files:
  - out/**
  - package.json
  - '!external-reference/**'
  - '!docs/**'
  - '!tests/**'
  - '!src/**'
  - '!node_modules/.cache/**'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/*.flow'
  - '!node_modules/**/test/**'
  - '!node_modules/**/tests/**'
  - '!node_modules/**/__tests__/**'
  - '!node_modules/**/docs/**'
  - '!node_modules/**/documentation/**'
  - '!node_modules/**/examples/**'
  - '!node_modules/**/.github/**'
  - '!node_modules/**/README.md'
  - '!node_modules/**/readme.md'
  - '!node_modules/**/CHANGELOG.md'
  - '!node_modules/**/changelog.md'
  - '!node_modules/@fig/autocomplete-helpers/node_modules/typescript/**'
  - '!node_modules/**/.DS_Store'
  - '!node_modules/**/Thumbs.db'
  - '!node_modules/@cline/**'
  - '!node_modules/node-linux-*/**'
  - '!node_modules/node-darwin-*/**'
  - '!node_modules/node-bin-darwin-*/**'
  - '!node_modules/node-win-*/**'
extraResources:
  - from: resources/product-telemetry-worker.js
    to: product-telemetry-worker.js
  - from: resources/icons
    to: icons
  - from: resources/codex-aiopsterm-mcp.js
    to: codex-aiopsterm-mcp.js
  - from: resources/aiopsterm-external-codex-mcp.js
    to: aiopsterm-external-codex-mcp.js
  - from: resources/aiopsterm-agent-hook.js
    to: aiopsterm-agent-hook.js
  - from: resources/aiopsterm-agent-hook-v1.ps1
    to: aiopsterm-agent-hook-v1.ps1
  - from: resources/aiopsterm-control.js
    to: aiopsterm-control.js
  - from: resources/builtin-plugins
    to: builtin-plugins
  - from: build/cline-sidecar
    to: cline-sidecar
  - from: docs/usage/best-practices
    to: docs/best-practices
asar: true
npmRebuild: false
afterPack: scripts/prune-packaged-native-modules.mjs
linux:
  maintainer: support@aiopsterm.com
  icon: icons
  target:
    - AppImage
    - deb
  category: Utility
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  protocols:
    - name: aiopsterm
      schemes:
        - aiopsterm
appImage:
  compression: zstd
win:
  icon: icon.ico
  target:
    - nsis
  artifactName: ${name}-${version}-setup-${arch}.${ext}
  protocols:
    - name: aiopsterm
      schemes:
        - aiopsterm
mac:
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-macos-${arch}.${ext}
  protocols:
    - name: aiopsterm
      schemes:
        - aiopsterm
